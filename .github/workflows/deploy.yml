name: Deploy

# main 에 push 하면 Cloudflare Workers 로 배포한다.
# 데이터 수집 워크플로가 끝난 뒤에도 workflow_call 로 불린다.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_SB: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 수집 워크플로가 방금 커밋한 데이터까지 받도록 브랜치 최신으로
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Cloudflare 시크릿 확인
        if: env.HAS_CF != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다. README 의 'Cloudflare 배포' 를 참고하세요."

      - name: Cloudflare Workers 배포
        id: deploy
        if: env.HAS_CF == 'true'
        # 저장소 변수 CUSTOM_DOMAIN 이 있으면 그 도메인에도 연결 (도메인이 Cloudflare 에 등록돼 있어야 함)
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            npx wrangler deploy --domain "$CUSTOM_DOMAIN"
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - name: AI 추천용 키를 워커 시크릿으로 동기화
        if: ${{ !cancelled() && env.HAS_CF == 'true' && env.HAS_AI == 'true' }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Supabase 키를 워커 시크릿으로 동기화
        if: ${{ !cancelled() && env.HAS_CF == 'true' && env.HAS_SB == 'true' }}
        run: printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
